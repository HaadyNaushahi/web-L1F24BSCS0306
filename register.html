<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset = "UFT-8">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <title>Tennis Club | Register</title>
    <link rel = "stylesheet" href = "css/register.css">
</head>
<body>

    <header class = "site-header">
	<a class = "logo" href = "index.html">Tennis Club</a>
	<nav class = "main-nav">
	    <a href = "index.html">Home</a>
	    <a href = "about.html">About Us</a>
	    <a href = "register.html" class = "active">Register</a>
	</nav>
    </header>

    <main>
	<h1>Become a Member</h1>
	<p class = "intro">Fields marked * are required. We will confirm your place within two working days.</p>
    
	<form action = "#" method = "post" class = "signup-form">

	    <fieldset>
		<legend>Your Details</legend>

		<div class = "field">
		    <label for="fullname">Full name * </label>
		    <input type = "text" id = "fullname" required minlength = "3" maxlength = "50">
		</div>
		<div class = "field">
		    <label for="email">Email *</label>
		    <input type = "email" id = "email" name = "email" required>
		</div>
		<div class = "field">
		    <label for="password">Email *</label>
		    <input type = "password" id = "password" name = "password" required minlength = "8" maxlength = "32">
		</div>
	    </fieldset>
